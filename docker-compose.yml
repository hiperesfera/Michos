services:
  kali-server:
    build:
      context: .
      dockerfile: Dockerfile.kali
    image: kali-mcp
    container_name: kali-mcp
    cap_add:
      - NET_RAW
      - NET_ADMIN
    environment:
      - COMMAND_TIMEOUT=18000
    ports:
      - "5000:5000"
    restart: unless-stopped

  ollama:
    image: ollama/ollama
    container_name: ollama
    ports:
      - "11434:11434"
    restart: unless-stopped

  webui:
    build:
      context: .
      dockerfile: Dockerfile.opencode
    image: opencode-runner
    container_name: webui
    depends_on:
      - kali-server
      - ollama
    volumes:
      - ./results:/results
    working_dir: /results
    environment:
      - OLLAMA_LOGIN_URL=${OLLAMA_LOGIN_URL:-}
    entrypoint: ["python3", "/app/webui/server.py"]
    ports:
      - "8080:8080"
    restart: unless-stopped
